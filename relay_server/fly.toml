app = 'p2p-relay-stefano'
primary_region = 'fra'

[build]

[[services]]
  internal_port = 8443
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8443

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"

[[vm]]
  memory = '256mb'
  cpus = 1